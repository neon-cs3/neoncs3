name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # SOURCE REPOSITORY
      # ============================================================

      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4
        with:
          path: src
          ref: master

      # ============================================================
      # BUILDS BRANCH
      # ============================================================

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4
        with:
          path: builds
          ref: builds

      # ============================================================
      # ESKİ CS3 DOSYALARINI TEMİZLE
      # ============================================================

      - name: Eski Derlemeleri Temizle
        run: |
          rm -f "$GITHUB_WORKSPACE"/builds/*.cs3

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      # ============================================================
      # GRADLE CACHE TEMİZLE
      # ============================================================

      - name: Bozuk Gradle Önbelleğini Temizle
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/com.github.recloudstream

      # ============================================================
      # EKLENTİLERİ DERLE
      # ============================================================

      - name: Eklentileri Derle
        run: |
          cd "$GITHUB_WORKSPACE/src"

          chmod +x gradlew

          ./gradlew make makePluginsJson

          shopt -s globstar

          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds/"

          cp build/plugins.json "$GITHUB_WORKSPACE/builds/plugins.json"

      # ============================================================
      # SHA256 VE DOSYA BOYUTU KONTROLÜ
      # ============================================================

      - name: Derleme Kontrolü
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          echo ""
          echo "=========================================="
          echo "CS3 DOSYASI"
          echo "=========================================="

          ls -lh *.cs3

          echo ""
          echo "=========================================="
          echo "GERÇEK SHA256"
          echo "=========================================="

          sha256sum HDFilmCehennemi.cs3

          echo ""
          echo "=========================================="
          echo "PLUGINS.JSON"
          echo "=========================================="

          cat plugins.json

          echo ""
          echo "=========================================="
          echo "DOSYA BOYUTLARI"
          echo "=========================================="

          stat -c "%n -> %s bytes" HDFilmCehennemi.cs3
          stat -c "%n -> %s bytes" plugins.json

      # ============================================================
      # BUILDS BRANCH'E YÜKLE
      # ============================================================

      - name: Derlemeleri Yükle
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          echo ""
          echo "=========================================="
          echo "GIT STATUS"
          echo "=========================================="

          git status

          echo ""
          echo "=========================================="
          echo "DOSYALAR EKLENİYOR"
          echo "=========================================="

          git add -A

          git status

          echo ""
          echo "=========================================="
          echo "COMMIT"
          echo "=========================================="

          git commit -m "CloudStream eklentilerini güncelle $GITHUB_SHA" || echo "Yeni değişiklik yok."

          echo ""
          echo "=========================================="
          echo "PUSH"
          echo "=========================================="

          git push origin builds
